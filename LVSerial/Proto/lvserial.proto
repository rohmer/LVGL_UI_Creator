syntax = "proto2";
package lvserial;
import "nanopb.proto";

// Stable entity tags shared by UICreator and embedded consumers.
enum EntityKind {
  WIDGET = 0;
  SCREEN = 1;
  VARIABLE = 2;
  PROJECT = 3;
  STYLE = 4;
  FONT = 5;
  ASSET = 6;
}
enum ValueKind {
  NULL_VALUE = 0;
  OBJECT = 1;
  ARRAY = 2;
  BOOLEAN = 3;
  SIGNED = 4;
  UNSIGNED = 5;
  REAL = 6;
  TEXT = 7;
  BINARY = 8;
  FONT_DATA = 9;
}

// Portable raster-font data. No C pointers, native structure padding, source
// file paths or platform font engine are needed on the device. All offsets are
// relative to bitmap; maps use the LVGL v9 cmap enum (legacy maps retain their
// explicit format_version). Repeated integer fields may use packed encoding.
message FontGlyph {
  required uint32 bitmap_index = 1;
  required uint32 advance = 2;
  required uint32 width = 3;
  required uint32 height = 4;
  required sint32 offset_x = 5;
  required sint32 offset_y = 6;
}
message FontCmap {
  required uint32 range_start = 1;
  required uint32 range_length = 2;
  required uint32 glyph_start = 3;
  required uint32 type = 4;
  optional uint32 format_version = 5;
  repeated uint32 unicode_list = 6 [packed = true];
  repeated uint32 glyph_offsets = 7 [packed = true];
}
message FontKerning {
  optional uint32 glyph_id_size = 1;
  repeated uint32 glyph_ids = 2 [packed = true];
  required bytes values = 3; // signed int8 two's-complement kerning values
  optional uint32 left_count = 4;
  optional uint32 right_count = 5;
  optional bytes left_classes = 6;
  optional bytes right_classes = 7;
}
message FontData {
  required uint32 format_version = 1 [default = 1];
  optional sint32 base_line = 2;
  required uint32 line_height = 3;
  optional uint32 cap_height = 4;
  optional uint32 x_height = 5;
  optional uint32 subpixel_mode = 6;
  optional uint32 kerning_mode = 7;
  optional sint32 underline_position = 8;
  optional uint32 underline_thickness = 9;
  required bytes bitmap = 10;
  required uint32 bitmap_format = 11;
  required uint32 bpp = 12;
  optional uint32 stride = 13;
  optional uint32 kern_scale = 14;
  optional uint32 kern_classes = 15;
  repeated FontGlyph glyphs = 16;
  repeated FontCmap cmaps = 17;
  optional FontKerning kern = 18 [(nanopb).type = FT_CALLBACK];
  // Presence and null differ in legacy JSON records; both round-trip exactly.
  optional bool kern_is_null = 19;
  optional uint32 cmap_count = 20;
}

// Typed property tree in preorder. Paths use RFC 6901 JSON Pointer escaping.
// Container nodes preserve empty objects/arrays and their child counts.
// Values are structured Protobuf fields, never an embedded JSON document.
// Record format 2: OBJECT may use signed_value as a default profile ID and
// unsigned_value as its presence mask (see Device/lvserial_defaults.c). Omitted
// entries are excluded from child_count. The C decoder expands defaults and
// child_count before invoking visitors. Other kinds retain their usual meaning.
message Property {
  required string path = 1 [(nanopb).max_size = 512];
  required ValueKind kind = 2;
  optional bool boolean_value = 3;
  optional sint64 signed_value = 4;
  optional uint64 unsigned_value = 5;
  optional double real_value = 6;
  optional bytes text_value = 7;
  optional uint32 child_count = 8;
  optional FontData font_value = 9 [(nanopb).type = FT_CALLBACK];
}
message Record {
  required uint32 format_version = 1 [default = 1];
  required EntityKind kind = 2;
  required string type = 3 [(nanopb).max_size = 64];
  repeated Property properties = 4;
}
